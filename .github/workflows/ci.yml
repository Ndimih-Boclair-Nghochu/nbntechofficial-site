name: CI

# The always-on guardrail: every push and PR to main must build, lint,
# typecheck, generate the Prisma client, and pass tests before it can ship.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dummy values so Prisma/Next can build without real secrets. Real values
    # live in Vercel/GitHub secrets; CI only needs the build to type-check.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
      NEXTAUTH_SECRET: ci-dummy-secret
      AUTH_SECRET: ci-dummy-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx next lint

      - name: Unit tests
        run: npm test --if-present

      - name: Production build
        run: npx next build
